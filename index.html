<style>
body {
    font-family: Arial;
    background-color: #f2f2f2;
    text-align: center;
    padding: 30px;
}

h1 {
    color: #128C7E;
}

input {
    width: 90%;
    padding: 15px;
    margin: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background-color: #25D366;
    color: white;
    padding: 15px 30px;
    border: none;
    border-radius: 25px;
    font-size: 18px;
}
</style>
<h1>Clinica Saúde & Vida</h1>
<p>Olá! 👋 Como podemos ajudar você?</p>

<label>Nome:</label>
<input type="text" id="nome">
<br><br>
<label>Especialidade:</label>
<select id="especialidade">
  <option>Clínico Geral</option>
  <option>Cardiologia</option>
  <option>Ortopedia</option>
  <option>Pediatria</option>
  <option>Outros</option>
</select>

<br><br>
<label>Como podemos ajudar?</label>
<input type="text" id="assunto">

<button onclick="abrirWhatsApp()">
  Falar no Whatsapp</button>

<script> 
  function abrirWhatsApp() {
  let nome = document.getElementById("nome").value;
  let assunto = document.getElementById("assunto").value;
  let especialidade = document.getElementById("especialidade").value;
  let numero="5582994239160";
  let mensagem = "Olá! Meu nome é " + nome +
". Gostaria de atendimento em " + especialidade +
". Preciso de ajuda com: " + assunto;
  window.open("https://wa.me/" + numero + 
  "?text=" + encodeURIComponent(mensagem));
}</script>
